name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    paths:
      - "trading-simulator/**"
      - "trading-benchmarks/**"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build trading-simulator
        working-directory: trading-simulator
        run: .\mvnw.cmd -B test

      - name: Install trading-simulator for benchmark resolution
        working-directory: trading-simulator
        run: .\mvnw.cmd -B -DskipTests install

      - name: Build trading-benchmarks
        working-directory: trading-benchmarks
        run: .\mvnw.cmd -B test