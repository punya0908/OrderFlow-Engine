name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    paths:
      - "trading-simulator/**"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build trading-simulator
        working-directory: trading-simulator
        run: mvn -B test

      - name: Install trading-simulator
        working-directory: trading-simulator
        run: mvn -B -DskipTests install